name: Deploy Docs

# The Chassis book at the site's root and the Python docs under /python/. A Pages site is one
# upload, so both are built and deployed together; separately, each would replace the other.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "chassisdb/docs/**"
      - "chassisdb/mkdocs.yml"
      - "chassisdb/chassisdb/**"
      # In llms-full.txt
      - "llms.txt"
      - "README.md"
      - "chassisdb/README.md"
      - "chassisdb/examples/**"
      - "scripts/llms_full.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The runner's stable as it is; rust-toolchain.toml would make rustup update it first.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        uses: taiki-e/install-action@mdbook

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Build the book and the Python docs
        run: |
          (cd docs && mdbook build)
          pip install "./chassisdb[docs]"
          (cd chassisdb && mkdocs build)
          mkdir site
          cp -r docs/book/. site/
          cp -r chassisdb/site site/python

      # Each book page's Markdown next to its HTML, which a fetch would otherwise get with the
      # sidebar, menus and keyboard help mixed in. Relative links between pages keep working.
      - name: Write each page's Markdown
        run: |
          (cd docs/src && find . -name '*.md') | while read -r page; do
            if [ -f "site/${page%.md}.html" ]; then cp "docs/src/$page" "site/$page"; fi
          done
          cp docs/src/introduction.md site/index.md

      # For agents: an index, and the guides and API references as one page of Markdown.
      - name: Write llms.txt and llms-full.txt
        run: |
          cp llms.txt site/
          python3 scripts/llms_full.py > site/llms-full.txt

      # For search engines, which may not run the JavaScript that draws the book's sidebar.
      - name: Write sitemap.xml
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            (cd site && find . -name '*.html' ! -name 404.html ! -name print.html ! -name toc.html ! -path ./introduction.html | sort) |
              sed -E -e 's#^\./##' -e 's#(^|/)index\.html$#\1#' -e 's#.*#  <url><loc>https://tanvincible.github.io/chassis/&</loc></url>#'
            echo '</urlset>'
          } > site/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
