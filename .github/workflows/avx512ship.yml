name: x86 avx512ship

# Experiment branch only: the shipped AVX-512 kernel (feat/avx512, PR #131) against main, in the
# same job, per CPU, dimension and size: searches on small pages and after warm, builds, and
# whether both return the same bits. The plan and the decision rule are in
# bench/lab/avx512ship-plan.md. Runs when this file changes; edit RUN to rerun.
on:
  push:
    branches: [lab/x86]
    paths: [.github/workflows/avx512ship.yml]

permissions:
  contents: read

env:
  RUN: 2
  MAIN: b009f3918b95b739adf8edda55c80672d6524def
  BRANCH: feat/avx512
  SHA: 8af0d41e913e4a8c3e0db9be5fbaedf51fd74315

jobs:
  ship:
    name: avx512ship (${{ matrix.name }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # RUN 1: dbpedia at 384, 768 and 1,536 × 99,000 and 1,536 × 2,000; gist 960 × 200,000;
        # sift 128 × 1,000,000. RUN 2: sizes off the 64-byte line (avx512ship-plan.md).
        name: [dbpedia-openai3-1536]
        shard: [a, b, c, d, e, f, g, h, i, j]
        include:
          - { name: dbpedia-openai3-1536, configs: "300:99000 1000:99000 1008:99000" }
    env:
      DATA: bench/ann/data
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo '```'
            lscpu | grep -E "L1d|L2|L3" || true
            echo "AVX-512: $(grep -o -w 'avx512[a-z0-9_]*' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)  page $(getconf PAGESIZE)  kernel $(uname -r)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir results
          lscpu > results/lscpu.txt
          cat /sys/kernel/mm/transparent_hugepage/enabled > results/thp.txt
          df -h / | tail -1

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: lab-data-${{ matrix.name }}-v1

      - name: Prepare the data
        run: |
          pip install -q numpy h5py pyarrow
          if [ ! -f "$DATA/$NAME.train.f32" ]; then
            if [ "$NAME" = gist-960 ]; then
              python - "$DATA" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "bench/ann")
          import h5py, prepare
          data = Path(sys.argv[1]); data.mkdir(parents=True, exist_ok=True)
          path = prepare.fetch("http://ann-benchmarks.com/gist-960-euclidean.hdf5", data / "gist.hdf5")
          with h5py.File(path) as f:
              prepare.write(data / "gist-960.train.f32", f["train"][:200000], "<f4")
              prepare.write(data / "gist-960.test.f32", f["test"][:1000], "<f4")
          PY
            else
              python bench/ann/prepare.py "$DATA"
            fi
            rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet "$DATA"/*.partial
            find "$DATA" -type f ! -name "$NAME.*" -delete
          fi
          ls -la "$DATA"
          cc -O2 -o "$RUNNER_TEMP/pagetool" bench/lab/pagetool.c -lpthread

      - name: Build main and the branch; the branch's distance tests
        run: |
          git fetch -q origin main "$BRANCH"
          for ref in "$MAIN" "$SHA"; do
            out=main; [ "$ref" = "$MAIN" ] || out=branch
            rm -rf "$RUNNER_TEMP/src"
            git worktree add --detach "$RUNNER_TEMP/src" "$ref"
            git -C "$RUNNER_TEMP/src" log --oneline -1 | sed "s/^/$out\t/" | tee -a results/sha.txt
            sed s/chassis_core/chassisdb/g chassis-core/examples/lab.rs > "$RUNNER_TEMP/src/chassis-core/examples/lab.rs"
            (cd "$RUNNER_TEMP/src" && RUSTFLAGS="--cfg lab_warm --cfg lab_half" \
              cargo build -q --release -p chassisdb --example lab --target-dir "$RUNNER_TEMP/t")
            cp "$RUNNER_TEMP/t/release/examples/lab" "$RUNNER_TEMP/lab-$out"
            if [ "$out" = branch ]; then
              (cd "$RUNNER_TEMP/src" && cargo test -q -p chassisdb --lib distance 2>&1 | tail -3) | tee results/unit.txt
            fi
            git worktree remove --force "$RUNNER_TEMP/src"
          done

      - name: The branch against main
        run: |
          T="$RUNNER_TEMP"
          export LAB_DIGEST=1
          for config in ${{ matrix.configs }}; do
            d=${config%%:*}; n=${config##*:}
            export LAB_DIMS=$d
            truth="$T/gt-$d-$n.u32"
            "$T/lab-main" truth "$DATA" "$NAME" "$n" "$truth"
            "$T/lab-main" build "$DATA" "$NAME" "$T/f.chassis" "$n" > /dev/null
            LAB_HALF=1 "$T/lab-main" build "$DATA" "$NAME" "$T/h.chassis" "$n" > /dev/null
            # warm asks for huge pages from 2 KB a vector; its arm searches a copy put out of
            # memory first, so the small-pages arm's file never gets them.
            arms="full half"
            if [ $((d * 4)) -ge 2048 ] && [ "$n" -ge 20000 ]; then
              arms="full half warm"
              cp "$T/f.chassis" "$T/w.chassis"
              "$T/pagetool" evict "$T/w.chassis" || true
            fi
            for round in 1 2 3; do
              for bin in main branch; do
                for arm in $arms; do
                  case $arm in
                    full) file=f; envs=() ;;
                    half) file=h; envs=(LAB_HALF=1) ;;
                    warm) file=w; envs=(LAB_WARMOPT=1) ;;
                  esac
                  env LAB_READER=1 "${envs[@]}" "$T/lab-$bin" search "$DATA" "$NAME" "$T/$file.chassis" "$truth" "$bin/$arm/$d:$n" \
                    2>> results/pages.txt | grep -v first_pass | tee -a results/lab.tsv
                done
              done
            done
            if [ "$n" -ge 20000 ]; then
              for k in 1 2; do
                for bin in main branch; do
                  "$T/lab-$bin" build "$DATA" "$NAME" "$T/b-$bin-$k.chassis" "$n" | sed "s/\tbase\t/\tbuild\/$bin\/$d:$n\t/" | tee -a results/lab.tsv
                done
              done
              for pair in "main-1 main-2" "main-1 branch-1" "branch-1 branch-2"; do
                set -- $pair
                if cmp -s "$T/b-$1.chassis" "$T/b-$2.chassis"; then same=same; else same=differ; fi
                printf 'cmp\t%s\t%s\t%s\t%s\n' "$d:$n" "$1" "$2" "$same" | tee -a results/cmp.tsv
              done
              rm -f "$T"/b-*.chassis*
            fi
            rm -f "$T"/[fhw].chassis*
          done
          { echo '```'; cat results/unit.txt results/cmp.tsv 2>/dev/null; awk -F'\t' '$4 == "search"' results/lab.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avx512ship-${{ matrix.name }}-${{ matrix.shard }}
          path: results/
