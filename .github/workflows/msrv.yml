name: MSRV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins stable for local work; without this, the job would build with it.
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.88

      - name: Check build with MSRV
        run: cargo check --all-features

      # compile_fail_tests compares rustc's error text, which changes between releases; the stable
      # jobs run it.
      - name: Run tests with MSRV
        run: cargo test --all-features -- --skip compile_fail_tests
