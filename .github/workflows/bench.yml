name: Benchmark

# Chassis against hnswlib on bench/ann datasets, on an x86 and an ARM runner. Run it from the
# Actions tab, or add the `benchmark` label to a pull request, which also runs the pull request's
# base, to show whether it made Chassis faster. Shared runners are noisy, so each job runs every
# engine forwards then backwards (Chassis, hnswlib, hnswlib, Chassis): compare engines within a
# job, not across runs. Compared versions need this workflow's harness (median of five passes).
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Space-separated: sift-128, glove-100, dbpedia-openai3-1536"
        default: sift-128
      refs:
        description: "Chassis versions to compare, space-separated git refs (default: this one)"
        default: ""
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    name: Benchmark (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      DATASETS: ${{ inputs.datasets || 'sift-128' }}
      DATA: bench/ann/data
      # Experiment only: the base and each step of the perf commits, in one job on one CPU.
      REFS: 349c655 4ff2f99 c45d6c0 7e32885
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        id: machine
        run: |
          echo "key=$(echo "$DATASETS" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo
            echo "SIMD: $(grep -owE 'avx2|avx512f|asimd|sve2?' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: ann-data-${{ hashFiles('bench/ann/prepare.py') }}-${{ steps.machine.outputs.key }}

      - name: Install hnswlib and prepare the data
        run: |
          # hnswlib builds from source with -march=native, so it gets this machine's SIMD.
          pip install numpy h5py pyarrow hnswlib
          python bench/ann/prepare.py "$DATA" $DATASETS
          rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet

      - name: Build each Chassis version
        run: |
          for ref in $REFS; do
            name="chassis-$(git rev-parse --short "$ref")"
            git worktree add "$RUNNER_TEMP/$name" "$ref"
            (cd "$RUNNER_TEMP/$name" && cargo build --release -p chassis-core --example ann)
            echo "$name $RUNNER_TEMP/$name/target/release/examples/ann" >> "$RUNNER_TEMP/engines"
          done

      - name: Run
        run: |
          names=($(cut -d' ' -f1 "$RUNNER_TEMP/engines") hnswlib)
          order=("${names[@]}")
          for ((i = ${#names[@]} - 1; i >= 0; i--)); do order+=("${names[i]}"); done
          mkdir results
          for dataset in $DATASETS; do
            for name in "${order[@]}"; do
              run=$(( $(find results -name "$dataset-$name-*" | wc -l) + 1 ))
              out="results/$dataset-$name-$run.tsv"
              if [ "$name" = hnswlib ]; then
                python bench/ann/reference_bench.py hnswlib "$DATA" "$dataset" > "$out"
              else
                "$(awk -v n="$name" '$1 == n { print $2 }' "$RUNNER_TEMP/engines")" "$DATA" "$dataset" > "$out"
              fi
            done
          done
          python bench/ann/summary.py results/*.tsv | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.runner }}
          path: results/
