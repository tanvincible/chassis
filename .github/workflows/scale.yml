name: x86 scale

# Experiment branch only: Chassis at ten million vectors, and in a cgroup with a third of the
# file's size in memory. The plan, predictions and decision rule are in bench/lab/scale-plan.md;
# RUN 2 adds the jobs `pages` and `long` to `main`.
# Runs when this file changes; edit RUN to rerun.
on:
  push:
    branches: [lab/x86]
    paths: [.github/workflows/scale.yml]

permissions:
  contents: read

env:
  RUN: 2
  SHA: d3424506503d3f08f7e61e7a8fbcb355ea107c6f
  N: 10000000
  ADDED: 100000

defaults:
  run:
    shell: bash

jobs:
  scale:
    name: scale (${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        job: [main, pages, long]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build the harness
        run: |
          git fetch -q origin lab/exp-scale
          git worktree add --detach "$RUNNER_TEMP/src" "$SHA"
          cargo build -q --release --example scale --manifest-path "$RUNNER_TEMP/src/Cargo.toml"
          cp "$RUNNER_TEMP/src/target/release/examples/scale" "$RUNNER_TEMP/scale"
          rm -rf "$RUNNER_TEMP/src/target"

      - name: Make room and describe the machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          dir=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -n | tail -1 | awk '{print $2}')
          dir="${dir%/}/scale"
          sudo mkdir -p "$dir" && sudo chown "$USER" "$dir"
          echo "DIR=$dir" >> "$GITHUB_ENV"
          mkdir results
          # Each command's lines go to results/scale.tsv with its label as the step.
          cat > "$RUNNER_TEMP/run.sh" <<'EOF'
          set -euo pipefail
          run() {
            local label=$1; shift
            /usr/bin/time -o "$RUNNER_TEMP/time" -f "scale\t-\twall_s\t%e\nscale\t-\tmax_rss_kb\t%M\nscale\t-\tmajor_faults\t%F" \
              "$RUNNER_TEMP/scale" "$@" > "$RUNNER_TEMP/out" || { cat "$RUNNER_TEMP/out"; return 1; }
            cat "$RUNNER_TEMP/out" "$RUNNER_TEMP/time" \
              | awk -v l="$label" 'BEGIN { FS = OFS = "\t" } { $2 = l; print }' \
              | tee -a results/scale.tsv
          }
          value() { awk -F'\t' -v l="$1" -v w="$2" '$2 == l && $3 == w { print $4 }' results/scale.tsv; }
          drop() { sync && echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null; }
          EOF
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(free -g | awk '/Mem:/ {print $2}') GB"
            echo '```'
            echo "kernel $(uname -r); index in $dir; THP $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
            df -h / /mnt 2>/dev/null || true
            swapon --show || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Disk latency
        if: matrix.job == 'main'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fio > /dev/null
          fio --name=lat --filename="$DIR/fio.dat" --size=4G --rw=randread --bs=4k --iodepth=1 \
            --direct=1 --ioengine=psync --runtime=30 --time_based --output-format=json > "$RUNNER_TEMP/fio.json"
          jq -r '.jobs[0].read.clat_ns | "scale\tfio\tmean_ns\t\(.mean)", "scale\tfio\tp50_ns\t\(.percentile["50.000000"])",
            "scale\tfio\tp99_ns\t\(.percentile["99.000000"])"' "$RUNNER_TEMP/fio.json" | tee -a results/scale.tsv
          rm "$DIR/fio.dat"

      - name: Build, search and check
        if: matrix.job == 'main'
        timeout-minutes: 150
        run: |
          source "$RUNNER_TEMP/run.sh"
          I="$DIR/index.chassis"
          run build build "$I" "$N"
          echo -e "scale\tbuild\tallocated_kb\t$(du -k "$I" | cut -f1)" | tee -a results/scale.tsv
          run exact exact "$N" built "$DIR/exact1"
          run built64 search "$I" 64 "$DIR/exact1" cold 1000
          run built256 search "$I" 256 "$DIR/exact1" cold 1000
          run built64_200 search "$I" 64 "$DIR/exact1" cold 200
          run check check "$I"
          run built_graph graph "$I"

      # The page cache is dropped before each pass: pages already cached stay charged to the cgroup
      # that read them, outside the cap, and a pass would start with the last one's.
      - name: In 2 GB of memory, with and without random access advised
        if: ${{ !cancelled() && matrix.job == 'main' }}
        timeout-minutes: 90
        run: |
          source "$RUNNER_TEMP/run.sh"
          I="$DIR/index.chassis" cg=/sys/fs/cgroup/scale
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null
          sudo mkdir "$cg"
          echo 2G | sudo tee "$cg/memory.max" > /dev/null
          echo 0 | sudo tee "$cg/memory.swap.max" > /dev/null
          echo $$ | sudo tee "$cg/cgroup.procs" > /dev/null
          grep -q ":/scale$" /proc/self/cgroup
          for arm in cold1:cold random1:random cold2:cold random2:random; do
            drop
            run "capped_${arm%%:*}" search "$I" 64 "$DIR/exact1" "${arm##*:}" 200
          done
          echo -e "scale\tcapped\tpeak_bytes\t$(cat "$cg/memory.peak")" | tee -a results/scale.tsv
          echo -e "scale\tcapped\toom_kills\t$(awk '$1 == "oom_kill" { print $2 }' "$cg/memory.events")" \
            | tee -a results/scale.tsv

      - name: A first pass in memory, with and without random access advised
        if: ${{ !cancelled() && matrix.job == 'main' }}
        run: |
          source "$RUNNER_TEMP/run.sh"
          I="$DIR/index.chassis"
          drop
          run uncapped_cold search "$I" 64 "$DIR/exact1" cold 1000
          drop
          run uncapped_random search "$I" 64 "$DIR/exact1" random 1000

      - name: Churn and kill
        if: ${{ !cancelled() && matrix.job == 'main' }}
        run: |
          source "$RUNNER_TEMP/run.sh"
          I="$DIR/index.chassis"
          run delete delete "$I" "$N"
          run add add "$I" $((N + 1000)) $((N + ADDED))
          run churned_check check "$I"
          run exact2 exact "$N" churned "$DIR/exact2"
          run churned64 search "$I" 64 "$DIR/exact2" cold 1000
          run churned256 search "$I" 256 "$DIR/exact2" cold 1000

          run before_crash graph "$I"
          "$RUNNER_TEMP/scale" crash "$I" "$N" > "$DIR/crash.out" 2>&1 &
          pid=$!
          until grep -q adding "$DIR/crash.out" || ! kill -0 "$pid" 2> /dev/null; do sleep 1; done
          sleep 20
          kill -9 "$pid" || true
          wait "$pid" || true
          awk 'BEGIN { FS = OFS = "\t" } /^scale/ { $2 = "crash"; print }' "$DIR/crash.out" | tee -a results/scale.tsv
          echo -e "scale\tcrash\tundo_bytes\t$(stat -c %s "$I.undo" 2> /dev/null || echo 0)" | tee -a results/scale.tsv
          run verify verify "$I" "$(value crash flushed_len)"
          run after_crash graph "$I"
          run crashed64 search "$I" 64 "$DIR/exact2" cold 1000

      - name: Compact in 1.2 times the file
        if: ${{ !cancelled() && matrix.job == 'main' }}
        run: |
          source "$RUNNER_TEMP/run.sh"
          I="$DIR/index.chassis" cg=/sys/fs/cgroup/compact
          cap=$(( $(stat -c %s "$I") * 12 / 10 ))
          sudo mkdir "$cg"
          echo "$cap" | sudo tee "$cg/memory.max" > /dev/null
          echo 0 | sudo tee "$cg/memory.swap.max" > /dev/null
          drop
          echo $$ | sudo tee "$cg/cgroup.procs" > /dev/null
          grep -q ":/compact$" /proc/self/cgroup
          set +e
          /usr/bin/time -o "$RUNNER_TEMP/time" -f "scale\t-\twall_s\t%e\nscale\t-\tmax_rss_kb\t%M\nscale\t-\tmajor_faults\t%F" \
            timeout 3600 "$RUNNER_TEMP/scale" compact "$I" > "$RUNNER_TEMP/out"
          status=$?
          set -e
          cat "$RUNNER_TEMP/out" "$RUNNER_TEMP/time" \
            | awk 'BEGIN { FS = OFS = "\t" } { $2 = "compact"; print }' | tee -a results/scale.tsv
          {
            echo -e "scale\tcompact\texit\t$status"
            echo -e "scale\tcompact\tcap_bytes\t$cap"
            echo -e "scale\tcompact\tpeak_bytes\t$(cat "$cg/memory.peak")"
            echo -e "scale\tcompact\toom_kills\t$(awk '$1 == "oom_kill" { print $2 }' "$cg/memory.events")"
          } | tee -a results/scale.tsv
          if [ "$status" = 0 ]; then
            run compacted64 search "$I" 64 "$DIR/exact2" cold 1000
            run compacted256 search "$I" 256 "$DIR/exact2" cold 1000
          else
            run unfinished_graph graph "$I"
            run unfinished_check check "$I"
          fi

      # The default first: a later build on the same runner is, if anything, the slower one.
      - name: Build with and without huge pages
        if: matrix.job == 'pages'
        run: |
          source "$RUNNER_TEMP/run.sh"
          I="$DIR/index.chassis"
          run default build "$I" "$N"
          rm -f "$I"
          export SCALE_HUGE=1
          run huge build "$I" "$N"

      - name: 1,536 dimensions at half precision
        if: matrix.job == 'long'
        run: |
          source "$RUNNER_TEMP/run.sh"
          export SCALE_DIMS=1536 SCALE_HALF=1 SCALE_CHUNK=100000
          I="$DIR/index.chassis" n=3000000
          run build build "$I" "$n"
          echo -e "scale\tbuild\tallocated_kb\t$(du -k "$I" | cut -f1)" | tee -a results/scale.tsv
          run exact exact "$n" built "$DIR/exact1"
          run long64 search "$I" 64 "$DIR/exact1" cold 1000
          run long256 search "$I" 256 "$DIR/exact1" cold 1000
          run check check "$I"
          run compact compact "$I"
          run compacted64 search "$I" 64 "$DIR/exact1" cold 1000
          run compacted256 search "$I" 256 "$DIR/exact1" cold 1000

      - name: Compare
        if: ${{ !cancelled() }}
        run: |
          source "$RUNNER_TEMP/run.sh"
          set +e
          same() { [ -n "$2" ] && [ "$2" = "$3" ] && echo "ok: $1" || echo "PROBLEM: $1 ($2 against $3)"; }
          {
            echo '```'
            if [ "${{ matrix.job }}" = main ]; then
              for arm in cold1 random1 cold2 random2; do
                same "capped $arm gives the uncapped results" "$(value "capped_$arm" pass1_digest)" "$(value built64_200 pass2_digest)"
              done
              same "the graph's lists after the kill, as sets" "$(value after_crash set_digest)" "$(value before_crash set_digest)"
              same "searches after the kill" "$(value crashed64 pass1_digest)" "$(value churned64 pass1_digest)"
              same "the graph's lists after the kill, in order (expected to differ)" "$(value after_crash ordered_digest)" "$(value before_crash ordered_digest)"
              [ "$(value crash undo_bytes)" -gt 0 ] && echo "ok: the kill left an undo file" || echo "PROBLEM: no undo file"
              grep -q finished_before_the_kill "$DIR/crash.out" && echo "PROBLEM: the add finished before the kill" || echo "ok: killed mid-add"
              [ "$(value capped oom_kills)" = 0 ] && echo "ok: no OOM kill under the 2 GB cap" || echo "PROBLEM: OOM kills"
              echo "compaction in 1.2 times the file: exit $(value compact exit), OOM kills $(value compact oom_kills)"
              if [ "$(value compact exit)" != 0 ]; then
                same "the index after an unfinished compaction" "$(value unfinished_graph set_digest)" "$(value after_crash set_digest)"
              fi
            fi
            echo '```'
            echo '```'
            cat results/scale.tsv
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-${{ env.RUN }}-${{ matrix.job }}
          path: results/
