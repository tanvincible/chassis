name: Filesystems

# The core's tests with their files on the filesystems users keep indexes on besides ext4, APFS and
# NTFS: other Linux filesystems, exFAT drives, network shares and ReFS. And a full disk, on those
# three and a few others.
on:
  push:
    branches: [main]
    paths: [chassis-core/**, Cargo.lock, .github/workflows/filesystems.yml]
  pull_request:
    branches: [main]
    paths: [chassis-core/**, Cargo.lock, .github/workflows/filesystems.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (${{ matrix.fs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fs: tmpfs, packages: "" }
          - { fs: xfs, packages: xfsprogs }
          - { fs: btrfs, packages: btrfs-progs }
          # Azure's kernel has no exFAT driver; FUSE's, as older distributions use.
          - { fs: exfat, packages: "exfatprogs exfat-fuse", type: fuseblk }
          - { fs: nfs4, packages: nfs-kernel-server }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: filesystems

      - name: Mount ${{ matrix.fs }} as the temporary directory
        run: |
          if [ -n "${{ matrix.packages }}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.packages }}
          fi
          dir="$RUNNER_TEMP/fs" img="$RUNNER_TEMP/fs.img"
          mkdir "$dir"
          case ${{ matrix.fs }} in
            tmpfs) sudo mount -t tmpfs -o size=8g tmpfs "$dir" ;;
            exfat)
              truncate -s 20G "$img" && sudo mkfs.exfat "$img"
              dev=$(sudo losetup -f --show "$img")
              sudo mount.exfat-fuse -o uid="$(id -u)",gid="$(id -g)" "$dev" "$dir" ;;
            nfs4)
              sudo mkdir /srv/chassis && sudo chown "$USER" /srv/chassis
              echo "/srv/chassis 127.0.0.1(rw,sync,no_subtree_check)" | sudo tee /etc/exports
              sudo exportfs -ra && sudo mount -t nfs4 127.0.0.1:/srv/chassis "$dir" ;;
            *)
              truncate -s 20G "$img" && sudo mkfs.${{ matrix.fs }} -q "$img"
              sudo mount -o loop "$img" "$dir" && sudo chown "$USER" "$dir" ;;
          esac
          test "$(findmnt -n -o FSTYPE -T "$dir")" = ${{ matrix.type || matrix.fs }}
          echo "TMPDIR=$dir" >> "$GITHUB_ENV"

      # compile_fail_tests builds in target/, which isn't on the mount; CI runs it.
      - name: Run the core's tests
        run: cargo test -p chassisdb --all-features --no-fail-fast -- --skip compile_fail_tests

  macos:
    name: macOS (exFAT)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: filesystems

      - name: Mount an exFAT disk image as the temporary directory
        run: |
          hdiutil create -size 20g -fs ExFAT -volname CHASSIS "$RUNNER_TEMP/fs.dmg"
          hdiutil attach "$RUNNER_TEMP/fs.dmg"
          diskutil info /Volumes/CHASSIS | grep -q "Personality: *ExFAT"
          echo "TMPDIR=/Volumes/CHASSIS" >> "$GITHUB_ENV"

      - name: Run the core's tests
        run: cargo test -p chassisdb --all-features --no-fail-fast -- --skip compile_fail_tests

  windows:
    name: Windows (${{ matrix.fs }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [smb, exfat, refs]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: filesystems

      # A share on this machine, reached by its UNC path as a network drive would be; or a virtual
      # disk formatted as exFAT or ReFS (Dev Drive's filesystem).
      - name: Use ${{ matrix.fs }} as the temporary directory
        shell: pwsh
        run: |
          if ("${{ matrix.fs }}" -eq "smb") {
            New-Item -ItemType Directory C:\chassis-share | Out-Null
            New-SmbShare -Name chassis -Path C:\chassis-share -FullAccess Everyone | Out-Null
            $dir = "\\localhost\chassis"
          } else {
            $vhd = "$env:RUNNER_TEMP\fs.vhdx"
            @(
              "create vdisk file=`"$vhd`" maximum=20480 type=expandable",
              "select vdisk file=`"$vhd`"",
              "attach vdisk",
              "create partition primary",
              "format fs=${{ matrix.fs }} quick",
              "assign letter=X"
            ) | Set-Content "$env:RUNNER_TEMP\diskpart.txt"
            diskpart /s "$env:RUNNER_TEMP\diskpart.txt"
            if ((Get-Volume -DriveLetter X).FileSystem -ne "${{ matrix.fs }}") { exit 1 }
            $dir = "X:\"
          }
          "TMP=$dir" >> $env:GITHUB_ENV
          "TEMP=$dir" >> $env:GITHUB_ENV

      - name: Run the core's tests
        run: cargo test -p chassisdb --all-features --no-fail-fast -- --skip compile_fail_tests

  # A full disk is an error, not a crash: the core's one test that fills a small file system.
  full-disk:
    name: Full disk (${{ matrix.fs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, fs: ext4, size: 96M }
          - { os: ubuntu-latest, fs: xfs, size: 320M, packages: xfsprogs }
          # Not Btrfs: it copies a page on every write, so allocating ahead can't promise the room,
          # and a full disk still ends the process there.
          - { os: ubuntu-latest, fs: tmpfs, size: 96m }
          - { os: macos-latest, fs: apfs, size: 96m }
          - { os: windows-latest, fs: ntfs, size: 96 }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: filesystems

      - name: Mount a small ${{ matrix.fs }}
        if: runner.os != 'Windows'
        run: |
          dir="$RUNNER_TEMP/full"
          case ${{ matrix.fs }} in
            apfs)
              hdiutil create -size ${{ matrix.size }} -fs APFS -volname FULL "$RUNNER_TEMP/full.dmg"
              hdiutil attach "$RUNNER_TEMP/full.dmg"
              dir=/Volumes/FULL ;;
            tmpfs)
              mkdir "$dir" && sudo mount -t tmpfs -o size=${{ matrix.size }} tmpfs "$dir" ;;
            *)
              if [ -n "${{ matrix.packages }}" ]; then
                sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.packages }}
              fi
              truncate -s ${{ matrix.size }} "$RUNNER_TEMP/full.img"
              sudo mkfs.${{ matrix.fs }} -q "$RUNNER_TEMP/full.img"
              mkdir "$dir" && sudo mount -o loop "$RUNNER_TEMP/full.img" "$dir" ;;
          esac
          [ "$(uname)" = Darwin ] || sudo chown "$USER" "$dir"
          echo "CHASSIS_FULL_DISK=$dir" >> "$GITHUB_ENV"

      - name: Mount a small NTFS disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\full.vhdx"
          @(
            "create vdisk file=`"$vhd`" maximum=${{ matrix.size }} type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick",
            "assign letter=F"
          ) | Set-Content "$env:RUNNER_TEMP\diskpart.txt"
          diskpart /s "$env:RUNNER_TEMP\diskpart.txt"
          "CHASSIS_FULL_DISK=F:\" >> $env:GITHUB_ENV

      - name: Fill it
        run: cargo test -p chassisdb --test full_disk_tests -- --ignored
