name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        rust: [stable, "1.88"]
    # rust-toolchain.toml pins stable for local work; without this, every job would build with it.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}

      # compile_fail_tests compares rustc's error text, which changes between releases.
      - name: Run tests
        run: cargo test --all-features ${{ matrix.rust != 'stable' && '-- --skip compile_fail_tests' || '' }}

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python and numpy the package allows, and the newest.
        include:
          - { python: "3.11", numpy: "numpy==1.26.4" }
          - { python: "3.14", numpy: "numpy" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the C library
        run: cargo build --release -p chassis-ffi

      - name: Run the Python tests
        working-directory: chassisdb
        env:
          CHASSIS_LIB_PATH: ${{ github.workspace }}/target/release
          PYTHONPATH: .
        run: |
          pip install "${{ matrix.numpy }}" pytest pytest-cov
          pytest

  mcp:
    name: MCP server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the C library
        run: cargo build --release -p chassis-ffi

      # Editable installs find the library in target/release. No dependencies from PyPI for these
      # two: chassisdb-mcp asks for the chassisdb this tree is about to release.
      - name: Run the MCP server's tests
        working-directory: chassisdb-mcp
        run: |
          pip install numpy pytest "mcp>=2.3,<3" "typing_extensions>=4.12" "fastembed>=0.7"
          pip install --no-deps -e ../chassisdb -e .
          python -m pytest tests

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff, black and mypy, as pyproject.toml sets them
        working-directory: chassisdb
        run: |
          pip install ruff black mypy numpy
          ruff check chassisdb tests examples
          black --check chassisdb tests examples
          mypy chassisdb

  langchain:
    name: LangChain integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the C library
        run: cargo build --release -p chassis-ffi

      # As for the MCP server: editable installs, no chassisdb from PyPI.
      - name: Run LangChain's standard tests and ours
        working-directory: integrations/langchain-chassisdb
        run: |
          pip install numpy pytest pytest-asyncio "langchain-core>=1.0,<2" langchain-tests
          pip install --no-deps -e ../../chassisdb -e .
          python -m pytest -q tests

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Check documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      # Miri can't map a file, so it runs the tests that work in memory: the header, node
      # records, the search loop's parts, distances, half precision, and lists rewritten while
      # readers walk them, where it catches any word touched other than atomically (ADR-0008).
      # The two skipped search tests build an index in a file.
      - name: Run the in-memory tests under Miri
        run: >
          cargo +nightly miri test -p chassisdb --lib --
          header:: hnsw::node:: hnsw::search::tests distance:: half::
          storage::tests::test_store_list storage::tests::test_readers_walking
          --skip test_distances_in_groups --skip test_ef_less_than_k
