name: Fuzz

# Opens damaged files, and any bytes, as an index, as a reader and as a writer, then searches and
# changes them (fuzz/): every outcome has to be an error or a result, never a panic or a crash.
# A minute per target on each pull request, half an hour each night.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [damaged, bytes]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@cargo-fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Fuzz
        working-directory: fuzz
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=${{ github.event_name == 'schedule' && 1800 || 60 }}

      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
