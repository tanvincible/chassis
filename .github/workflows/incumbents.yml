name: x86 incumbents

# Experiment branch only: Chassis beside other engines on the same vectors: hnswlib, usearch,
# FAISS, Annoy, sqlite-vec and LanceDB, each through its Python package, and Chassis through its
# own. Runs when this file changes; edit RUN to rerun.
on:
  push:
    branches: [lab/x86]
    paths: [.github/workflows/incumbents.yml]

permissions:
  contents: read

env:
  RUN: 10
  CHASSIS: lab/exp-dist
jobs:
  dims:
    name: incumbents (${{ matrix.name }} ${{ matrix.runner }} ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        name: [dbpedia-openai3-1536]
        runner: [ubuntu-latest]
        shard: [a, b, c, d, e, f]
        include:
          - { name: dbpedia-openai3-1536, n: 99000 }
    env:
      DATA: bench/ann/data
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo '```'
            lscpu | grep -E "L1d|L2|L3" || true
            echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)  page $(getconf PAGESIZE)  kernel $(uname -r)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir results
          lscpu > results/lscpu.txt
          df -h / | tail -1

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: lab-data-${{ matrix.name }}-v1

      - name: Prepare the data and hnswlib
        run: |
          pip install -q numpy h5py pyarrow
          if [ ! -f "$DATA/$NAME.train.f32" ]; then
            if [ "$NAME" = gist-960 ]; then
              python - "$DATA" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "bench/ann")
          import h5py, prepare
          data = Path(sys.argv[1]); data.mkdir(parents=True, exist_ok=True)
          path = prepare.fetch("http://ann-benchmarks.com/gist-960-euclidean.hdf5", data / "gist.hdf5")
          with h5py.File(path) as f:
              prepare.write(data / "gist-960.train.f32", f["train"][:200000], "<f4")
              prepare.write(data / "gist-960.test.f32", f["test"][:1000], "<f4")
          PY
            else
              python bench/ann/prepare.py "$DATA"
            fi
            rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet "$DATA"/*.partial
            find "$DATA" -type f ! -name "$NAME.*" -delete
          fi
          ls -la "$DATA"
          git clone -q --depth 1 --branch v0.8.0 https://github.com/nmslib/hnswlib "$RUNNER_TEMP/hnswlib"
          g++ -std=c++17 -O3 -march=native -o "$RUNNER_TEMP/hnsw_lab" bench/lab/hnsw_lab.cpp -I "$RUNNER_TEMP/hnswlib" -lpthread

      - name: Build Chassis, its Python package and the other engines
        run: |
          git fetch -q origin "$CHASSIS"
          git worktree add --detach "$RUNNER_TEMP/src" FETCH_HEAD
          sed s/chassis_core/chassisdb/g chassis-core/examples/lab.rs > "$RUNNER_TEMP/src/chassis-core/examples/lab.rs"
          (cd "$RUNNER_TEMP/src" && RUSTFLAGS="--cfg lab --cfg lab_hp" \
            cargo build --release -p chassisdb --example lab --target-dir "$RUNNER_TEMP/t")
          cp "$RUNNER_TEMP/t/release/examples/lab" "$RUNNER_TEMP/lab"
          cc -O2 -o "$RUNNER_TEMP/pagetool" bench/lab/pagetool.c -lpthread
          pip install -q numpy faiss-cpu==1.15.1
          pip list 2>/dev/null | grep -iE "numpy|faiss" | tee -a results/versions.txt

      - name: Every engine on the same vectors
        env:
          N: ${{ matrix.n }}
        run: |
          L="$RUNNER_TEMP/lab"; T="$RUNNER_TEMP"; truth="$T/gt.u32"
          "$L" truth "$DATA" "$NAME" "$N" "$truth"
          "$L" build "$DATA" "$NAME" "$T/c.chassis" "$N" | tee -a results/lab.tsv
          # Each arm reads the index from disk under its own advice, then searches it in memory.
          for round in 1 2 3; do
            for pf in 0 8 32; do
              for huge in "" 1; do
                "$T/pagetool" evict "$T/c.chassis"
                env LAB_PF=$pf ${huge:+LAB_HUGE=1} "$L" search "$DATA" "$NAME" "$T/c.chassis" "$truth" "pf$pf${huge:+-huge}" 2>>results/pages.txt | grep -v first_pass | tee -a results/lab.tsv
              done
            done
          done
          for engine in faiss faiss-4k faiss-again; do
            timeout 2400 python bench/lab/incumbents.py "$engine" "$DATA" "$NAME" "$N" "$truth" "$T/inc" > "$T/inc.out" 2>&1 || echo "inc-failed $engine" | tee -a results/inc.log
            grep "^inc" "$T/inc.out" | tee -a results/inc.tsv || true
            grep -v "^inc" "$T/inc.out" | tail -5 >> results/inc.log || true
          done
          cat results/pages.txt
          { echo '```'; cat results/inc.tsv; cat results/inc.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incumbents-${{ matrix.name }}-${{ matrix.runner }}-${{ matrix.shard }}
          path: results/
