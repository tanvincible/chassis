name: x86 lab

# Experiment branch only: where the time goes in search and build on GitHub's x86 runners, against
# hnswlib built with -march=native on the same machine. Three identical x86 jobs, since GitHub
# hands out different CPUs.
on:
  push:
    branches: [lab/x86]
    paths-ignore: [.github/workflows/compare.yml]

permissions:
  contents: read

jobs:
  lab:
    name: lab (${{ matrix.runner }} ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, shard: a }
          - { runner: ubuntu-latest, shard: b }
          - { runner: ubuntu-latest, shard: c }
          - { runner: ubuntu-latest, shard: d }
          - { runner: ubuntu-latest, shard: e }
          - { runner: ubuntu-24.04-arm, shard: a }
    env:
      DATA: bench/ann/data
      NAME: sift-128
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo
            echo '```'
            lscpu | grep -E "Model name|CPU family|Model:|Thread|Core|Socket|L1d|L2|L3|MHz" || true
            echo "SIMD: $(grep -owE 'avx2|fma|avx512f|avx512vl|avx512_vnni|asimd|sve2?' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)  kernel $(uname -r)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: ann-data-${{ hashFiles('bench/ann/prepare.py') }}-sift-128

      - name: Prepare the data and hnswlib
        run: |
          pip install numpy h5py pyarrow
          python bench/ann/prepare.py "$DATA" "$NAME"
          rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet
          git clone -q --depth 1 --branch v0.8.0 https://github.com/nmslib/hnswlib "$RUNNER_TEMP/hnswlib"
          g++ -std=c++17 -O3 -march=native -o "$RUNNER_TEMP/hnsw_lab" bench/lab/hnsw_lab.cpp -I "$RUNNER_TEMP/hnswlib" -lpthread

      - name: Build the Chassis variants
        run: |
          RUSTFLAGS="--cfg lab" cargo build --release -p chassis-core --example lab --target-dir "$RUNNER_TEMP/t-base"
          cp "$RUNNER_TEMP/t-base/release/examples/lab" "$RUNNER_TEMP/lab-base"
          # The loop as shipped on perf/hot-path, to check it against this branch's lean loop.
          git fetch -q origin perf/hot-path
          git worktree add "$RUNNER_TEMP/product" FETCH_HEAD
          cp chassis-core/examples/lab.rs "$RUNNER_TEMP/product/chassis-core/examples/lab.rs"
          (cd "$RUNNER_TEMP/product" && cargo build --release -p chassis-core --example lab)
          cp "$RUNNER_TEMP/product/target/release/examples/lab" "$RUNNER_TEMP/lab-product"

      - name: Search 1,000,000 vectors
        run: |
          mkdir results
          L="$RUNNER_TEMP/lab-base"
          n=1000000
          truth="$DATA/$NAME.gt.u32"
          index="$RUNNER_TEMP/default.chassis"
          "$L" build "$DATA" "$NAME" "$index" "$n" | tee -a results/lab.tsv
          "$RUNNER_TEMP/hnsw_lab" build "$DATA/$NAME.train.f32" "$n" "$RUNNER_TEMP/h-$n.bin" "$(nproc)" | tee -a results/lab.tsv
          lean() { # LAB_FAST, LAB_PF
            LAB_FAST="$1" LAB_PF="$2" "$L" search "$DATA" "$NAME" "$index" "$truth" "lab/fast$1/$2" 2> /dev/null | tee -a results/lab.tsv
          }
          for round in 1 2 3; do
            "$RUNNER_TEMP/hnsw_lab" search "$RUNNER_TEMP/h-$n.bin" "$DATA/$NAME.train.f32" "$DATA/$NAME.test.f32" "$truth" native 2> /dev/null | tee -a results/lab.tsv
            lean 0 0,8,0,0
            for pf in 0,3,0,2 0,8,0,2 5,8,0,2; do lean 1 "$pf"; done
            "$RUNNER_TEMP/lab-product" search "$DATA" "$NAME" "$index" "$truth" product 2> /dev/null | tee -a results/lab.tsv
          done

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat results/lab.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.runner }}-${{ matrix.shard }}
          path: results/
