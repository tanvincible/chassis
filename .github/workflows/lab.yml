name: x86 lab

# Experiment branch only: where the time goes in search and build on GitHub's x86 runners, against
# hnswlib built with -march=native on the same machine. Three identical x86 jobs, since GitHub
# hands out different CPUs.
on:
  push:
    branches: [lab/x86]
    paths-ignore: [.github/workflows/compare.yml]

permissions:
  contents: read

jobs:
  lab:
    name: lab (${{ matrix.runner }} ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, shard: a }
          - { runner: ubuntu-latest, shard: b }
          - { runner: ubuntu-latest, shard: c }
          - { runner: ubuntu-latest, shard: d }
          - { runner: ubuntu-latest, shard: e }
          - { runner: ubuntu-24.04-arm, shard: a }
    env:
      DATA: bench/ann/data
      NAME: sift-128
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo
            echo '```'
            lscpu | grep -E "Model name|Thread|Core|Socket|L1d|L2|L3|MHz" || true
            echo "SIMD: $(grep -owE 'avx2|fma|avx512f|avx512vl|avx512_vnni|asimd|sve2?' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)  kernel $(uname -r)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: ann-data-${{ hashFiles('bench/ann/prepare.py') }}-sift-128

      - name: Prepare the data and hnswlib
        run: |
          pip install numpy h5py pyarrow
          python bench/ann/prepare.py "$DATA" "$NAME"
          rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet
          git clone -q --depth 1 --branch v0.8.0 https://github.com/nmslib/hnswlib "$RUNNER_TEMP/hnswlib"
          g++ -std=c++17 -O3 -march=native -o "$RUNNER_TEMP/hnsw_lab" bench/lab/hnsw_lab.cpp -I "$RUNNER_TEMP/hnswlib" -lpthread

      - name: Build the Chassis variants
        run: |
          build() { # name, rustflags
            RUSTFLAGS="--cfg lab $2" cargo build --release -p chassis-core --example lab --target-dir "$RUNNER_TEMP/t-$1"
            cp "$RUNNER_TEMP/t-$1/release/examples/lab" "$RUNNER_TEMP/lab-$1"
          }
          build base ""
          build count "--cfg lab_count"
          if [ "$(uname -m)" = x86_64 ]; then build v3 "-C target-cpu=x86-64-v3"; fi

      - name: One-thread builds of 100,000 vectors
        run: |
          mkdir results
          seq() { # variant, LAB_FAST, LAB_BUILD
            LAB_FAST="$2" LAB_PF=0,8,0,2 LAB_BUILD="$3" "$RUNNER_TEMP/lab-$1" seq "$DATA" "$NAME" 100000 "$1/fast$2/build$3" | tee -a results/lab.tsv
          }
          for round in 1 2; do
            "$RUNNER_TEMP/hnsw_lab" build "$DATA/$NAME.train.f32" 100000 "$RUNNER_TEMP/h-seq.bin" 1 | tee -a results/lab.tsv
            seq base 0 9999,1
            for rule in 9999,1 16,1 32,0 16,0; do seq base 1 "$rule"; done
          done

      - name: Search 1,000,000 vectors
        run: |
          L="$RUNNER_TEMP/lab-base"
          n=1000000
          truth="$DATA/$NAME.gt.u32"
          best=base; [ "$(uname -m)" = x86_64 ] && best=v3
          chassis() { # variant, LAB_FAST, LAB_PF, index, [extra env]
            env $5 LAB_FAST="$2" LAB_PF="$3" "$RUNNER_TEMP/lab-$1" search "$DATA" "$NAME" "$4" "$truth" "$1/fast$2/$3/$(basename "$4" .chassis)${5:+/$5}" 2>> results/pages.txt | tee -a results/lab.tsv
          }
          hnsw() { # tag, [extra env]
            env $2 "$RUNNER_TEMP/hnsw_lab" search "$RUNNER_TEMP/h-$n.bin" "$DATA/$NAME.train.f32" "$DATA/$NAME.test.f32" "$truth" "$1" 2>> results/pages.txt | tee -a results/lab.tsv
          }
          # One index per graph rule: Chassis's (a new node selects up to M0 and fills), each half
          # of it changed, and hnswlib's (selects M, no fill).
          for rule in 9999,1 16,1 32,0 16,0; do
            LAB_FAST=1 LAB_PF=0,8,0,2 LAB_BUILD="$rule" "$L" build "$DATA" "$NAME" "$RUNNER_TEMP/g$rule.chassis" "$n" | sed "s/\tbase\t/\tbuild$rule\t/" | tee -a results/lab.tsv
          done
          "$RUNNER_TEMP/hnsw_lab" build "$DATA/$NAME.train.f32" "$n" "$RUNNER_TEMP/h-$n.bin" "$(nproc)" | tee -a results/lab.tsv
          default="$RUNNER_TEMP/g9999,1.chassis"
          for rule in 9999,1 16,1 32,0 16,0; do chassis count 1 0,8,0,2 "$RUNNER_TEMP/g$rule.chassis"; done
          for round in 1 2; do
            hnsw native
            hnsw nothp LAB_NO_THP=1
            chassis base 0 0,8,0,0 "$default"
            # How many lines to hint into L1, all into L2, and the first lines into L1 with the
            # rest into L2.
            for pf in 0,2,0,2 0,3,0,2 0,4,0,2 0,5,0,2 0,6,0,2 0,8,0,2 5,8,0,2 5,4,0,2 7,8,1,2 7,8,2,2 7,8,3,2 7,8,4,2; do
              chassis base 1 "$pf" "$default"
            done
            for pf in 0,3,0,2 0,8,0,2 5,8,0,2 7,8,3,2; do
              chassis "$best" 1 "$pf" "$default"
              for rule in 16,1 32,0 16,0; do chassis "$best" 1 "$pf" "$RUNNER_TEMP/g$rule.chassis"; done
            done
            chassis "$best" 1 0,8,0,2 "$default" LAB_MADV=1
            hnsw native
          done

      - name: Huge pages for a file mapping
        if: runner.arch == 'X64'
        run: |
          n=1000000
          truth="$DATA/$NAME.gt.u32"
          run() { # tag, index, [extra env]
            env $3 LAB_FAST=1 LAB_PF=0,8,0,2 "$RUNNER_TEMP/lab-v3" search "$DATA" "$NAME" "$2" "$truth" "$1" 2>> results/pages.txt | tee -a results/lab.tsv
          }
          # The page cache read back from disk with huge pages asked for.
          sync; echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          run ext4-reread-madv "$RUNNER_TEMP/g9999,1.chassis" LAB_MADV=1
          run ext4-reread-madv "$RUNNER_TEMP/g9999,1.chassis" LAB_MADV=1
          # The same file in shared memory, where the kernel can be told to use huge pages.
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/shmem_enabled || true
          sudo mount -o remount,huge=always /dev/shm || true
          cp "$RUNNER_TEMP/g9999,1.chassis" /dev/shm/huge.chassis
          run shm-huge /dev/shm/huge.chassis LAB_MADV=1
          run shm-huge /dev/shm/huge.chassis LAB_MADV=1
          cat results/pages.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat results/lab.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.runner }}-${{ matrix.shard }}
          path: results/
