name: x86 group

# Experiment branch only: a search's distances computed in groups of 1, 2, 4 or 8 vectors, with
# one sum each or with four (the same sums as alone), against how much of each vector is asked
# for ahead; full and half precision; in cache and out. Runs when this file changes; edit RUN to
# rerun.
on:
  push:
    branches: [lab/x86]
    paths: [.github/workflows/group.yml]

permissions:
  contents: read

env:
  RUN: 2
  CHASSIS: lab/exp-group
jobs:
  dims:
    name: group (${{ matrix.name }} ${{ matrix.runner }} ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        name: [dbpedia-openai3-1536, gist-960]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        shard: [a, b, c, d, e, f]
        include:
          - { name: dbpedia-openai3-1536, sizes: "2000 20000 99000" }
          - { name: gist-960, sizes: "20000 200000" }
        exclude:
          - { runner: ubuntu-24.04-arm, shard: c }
          - { runner: ubuntu-24.04-arm, shard: d }
          - { runner: ubuntu-24.04-arm, shard: e }
          - { runner: ubuntu-24.04-arm, shard: f }
    env:
      DATA: bench/ann/data
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo '```'
            lscpu | grep -E "L1d|L2|L3" || true
            echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)  page $(getconf PAGESIZE)  kernel $(uname -r)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir results
          lscpu > results/lscpu.txt
          df -h / | tail -1

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: lab-data-${{ matrix.name }}-v1

      - name: Prepare the data and hnswlib
        run: |
          pip install -q numpy h5py pyarrow
          if [ ! -f "$DATA/$NAME.train.f32" ]; then
            if [ "$NAME" = gist-960 ]; then
              python - "$DATA" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "bench/ann")
          import h5py, prepare
          data = Path(sys.argv[1]); data.mkdir(parents=True, exist_ok=True)
          path = prepare.fetch("http://ann-benchmarks.com/gist-960-euclidean.hdf5", data / "gist.hdf5")
          with h5py.File(path) as f:
              prepare.write(data / "gist-960.train.f32", f["train"][:200000], "<f4")
              prepare.write(data / "gist-960.test.f32", f["test"][:1000], "<f4")
          PY
            else
              python bench/ann/prepare.py "$DATA"
            fi
            rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet "$DATA"/*.partial
            find "$DATA" -type f ! -name "$NAME.*" -delete
          fi
          ls -la "$DATA"
          git clone -q --depth 1 --branch v0.8.0 https://github.com/nmslib/hnswlib "$RUNNER_TEMP/hnswlib"
          g++ -std=c++17 -O3 -march=native -o "$RUNNER_TEMP/hnsw_lab" bench/lab/hnsw_lab.cpp -I "$RUNNER_TEMP/hnswlib" -lpthread

      - name: Build Chassis
        run: |
          git fetch -q origin "$CHASSIS"
          git worktree add --detach "$RUNNER_TEMP/src" FETCH_HEAD
          cp chassis-core/examples/lab.rs "$RUNNER_TEMP/src/chassis-core/examples/lab.rs"
          (cd "$RUNNER_TEMP/src" && RUSTFLAGS="--cfg lab_half" cargo build --release -p chassis-core --example lab --target-dir "$RUNNER_TEMP/t")
          cp "$RUNNER_TEMP/t/release/examples/lab" "$RUNNER_TEMP/lab"
          cc -O2 -o "$RUNNER_TEMP/pagetool" bench/lab/pagetool.c -lpthread

      - name: Group widths against prefetch depths
        run: |
          L="$RUNNER_TEMP/lab"
          for n in ${{ matrix.sizes }}; do
            truth="$RUNNER_TEMP/gt-$n.u32"
            "$L" truth "$DATA" "$NAME" "$n" "$truth"
            "$L" build "$DATA" "$NAME" "$RUNNER_TEMP/f-$n.chassis" "$n" | tee -a results/lab.tsv
            LAB_HALF=1 "$L" build "$DATA" "$NAME" "$RUNNER_TEMP/h-$n.chassis" "$n" | sed 's/\tbase\t/\thalf\t/' | tee -a results/lab.tsv
            for round in 1 2 3; do
              for precision in full half; do
                file="$RUNNER_TEMP/f-$n.chassis"; half=""
                if [ $precision = half ]; then file="$RUNNER_TEMP/h-$n.chassis"; half=1; fi
                # LAB_GROUP=width[,same]; LAB_PF=near,lines, capped at the vector's lines.
                for group in 1 2,same 4,same 8,same; do
                  for pf in default; do
                    pfenv=""; [ $pf != default ] && pfenv="LAB_PF=$pf"
                    env LAB_READER=1 ${half:+LAB_HALF=1} LAB_GROUP=$group $pfenv "$L" search "$DATA" "$NAME" "$file" "$truth" "$precision/g$group/pf-$pf" 2>/dev/null | grep -v first_pass | tee -a results/lab.tsv
                  done
                done
              done
            done
          done
          # Builds link through the same search: the widest size, full precision.
          n=$(echo ${{ matrix.sizes }} | awk '{print $NF}')
          for group in 1 2,same 4,same 8,same; do
            LAB_GROUP=$group "$L" build "$DATA" "$NAME" "$RUNNER_TEMP/b-$n.chassis" "$n" | sed "s/\tbase\t/\tbuild\/g$group\t/" | tee -a results/lab.tsv
          done
          { echo '```'; cat results/lab.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-${{ matrix.name }}-${{ matrix.runner }}-${{ matrix.shard }}
          path: results/
