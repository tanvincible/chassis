name: x86 sweep

# Experiment branch only: prefetch policies on indexes that fit in cache, Chassis beside hnswlib.
# Runs when this file changes; edit RUN to rerun.
on:
  push:
    branches: [lab/x86]
    paths: [.github/workflows/sweep.yml]

permissions:
  contents: read

env:
  RUN: 1

jobs:
  sweep:
    name: sweep (${{ matrix.runner }} ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, shard: a }
          - { runner: ubuntu-latest, shard: b }
          - { runner: ubuntu-latest, shard: c }
          - { runner: ubuntu-latest, shard: d }
          - { runner: ubuntu-24.04-arm, shard: a }
    env:
      DATA: bench/ann/data
      NAME: sift-128
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Describe the machine
        run: |
          {
            echo "## $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPUs, $(uname -m)"
            echo '```'
            lscpu | grep -E "L1d|L2|L3" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir results
          lscpu > results/lscpu.txt

      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: ann-data-${{ hashFiles('bench/ann/prepare.py') }}-sift-128

      - name: Prepare the data and hnswlib
        run: |
          pip install numpy h5py pyarrow
          python bench/ann/prepare.py "$DATA" "$NAME"
          rm -f "$DATA"/*.hdf5 "$DATA"/*.parquet
          git clone -q --depth 1 --branch v0.8.0 https://github.com/nmslib/hnswlib "$RUNNER_TEMP/hnswlib"
          g++ -std=c++17 -O3 -march=native -o "$RUNNER_TEMP/hnsw_lab" bench/lab/hnsw_lab.cpp -I "$RUNNER_TEMP/hnswlib" -lpthread

      - name: Build Chassis with the policy knob
        run: |
          git fetch -q origin lab/exp-pf
          git worktree add "$RUNNER_TEMP/src" FETCH_HEAD
          cp chassis-core/examples/lab.rs "$RUNNER_TEMP/src/chassis-core/examples/lab.rs"
          (cd "$RUNNER_TEMP/src" && RUSTFLAGS="--cfg lab" cargo build --release -p chassis-core --example lab --target-dir "$RUNNER_TEMP/t")
          cp "$RUNNER_TEMP/t/release/examples/lab" "$RUNNER_TEMP/lab"

      - name: Sweep
        run: |
          L="$RUNNER_TEMP/lab"
          for n in 2000 20000 100000; do
            truth="$RUNNER_TEMP/gt-$n.u32"
            "$L" truth "$DATA" "$NAME" "$n" "$truth"
            "$L" build "$DATA" "$NAME" "$RUNNER_TEMP/c-$n.chassis" "$n" | tee -a results/lab.tsv
            "$RUNNER_TEMP/hnsw_lab" build "$DATA/$NAME.train.f32" "$n" "$RUNNER_TEMP/h-$n.bin" "$(nproc)" | tee -a results/lab.tsv
            for round in 1 2 3; do
              LAB_PASSES=3 "$RUNNER_TEMP/hnsw_lab" search "$RUNNER_TEMP/h-$n.bin" "$DATA/$NAME.train.f32" "$DATA/$NAME.test.f32" "$truth" native 2>/dev/null | tee -a results/lab.tsv
              for pf in default 0,0 0,1 1,1 2,2 4,4 8,8 0,8 2,8; do
                spec=$pf; [ "$pf" = default ] && spec=
                LAB_PF=$spec LAB_PASSES=3 "$L" search "$DATA" "$NAME" "$RUNNER_TEMP/c-$n.chassis" "$truth" "pf$pf" 2>/dev/null | tee -a results/lab.tsv
              done
            done
          done
          {
            echo '```'
            cat results/lab.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.runner }}-${{ matrix.shard }}
          path: results/
