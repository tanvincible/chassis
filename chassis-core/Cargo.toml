[package]
name = "chassisdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Chassis: an embedded vector index for local semantic search, in one file."

[dependencies]
anyhow = { workspace = true }
fs2 = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
rand = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[features]
default = []
# The layers under the index, for this crate's tests and benchmarks. No semver promise: any
# release may change or remove them.
internals = []

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "hnsw_node_bench"
harness = false

[[bench]]
name = "graph_io_bench"
harness = false

[[bench]]
name = "link_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "distance_bench"
harness = false

[dev-dependencies]
criterion = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
trybuild = { workspace = true }
chassisdb = { path = ".", features = ["internals"] }
