[package]
name = "chassis-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
# A C library, shipped with each release, not on crates.io.
publish = false

[lib]
crate-type = ["cdylib"]  # Create dynamic library for C FFI
name = "chassis_ffi"

[dependencies]
anyhow = { workspace = true }
chassis-core = { path = "../chassis-core" }
libc = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[profile.release]
# Optimize for size and safety in release builds
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"  # Panics become aborts (but we catch them at FFI boundary)
