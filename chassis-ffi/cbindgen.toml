# cbindgen configuration for Chassis FFI

language = "C"
cpp_compat = true
pragma_once = true
include_guard = "CHASSIS_H"
include_version = false
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

header = """
/* Chassis, an embedded vector index for local semantic search - C API */

/* Thread safety: every function but chassis_free may be called from any thread on a shared
   handle. Searches run concurrently; adds, deletes and flushes take the handle's write lock.
   chassis_free must not race any other call. A reader handle runs one call at a time. */
"""

autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

[parse]
parse_deps = false
include = ["chassis-ffi"]
clean = false

[export]
prefix = ""
item_types = ["functions", "structs", "opaque", "constants"]

[fn]
args = "horizontal"
rename_args = "None"
sort_by = "None"

[struct]
rename_fields = "None"
derive_eq = false
derive_neq = false

[enum]
rename_variants = "None"

[const]
allow_static_const = true
allow_constexpr = false
